

name: Build Windows Executable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (leave empty for latest commit)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-gst-plugins-ugly
            mingw-w64-x86_64-gst-libav
            mingw-w64-x86_64-pyinstaller
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gettext-tools
            base-devel
      
      - name: Compile GResources
        run: |
          cd src
          glib-compile-resources albasheer.gresource.xml
          ls -la
      
      - name: Build with PyInstaller
        run: |
          pyinstaller pyinstaller/albasheer.spec
      
      
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path dist/albasheer/* -DestinationPath "albasheer-windows-$version.zip"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: albasheer-windows
          path: albasheer-windows-*.zip
          retention-days: 30
      
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: albasheer-windows-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
